name: Sync from wickra-strategy-ci

# Every value this site states about wickra-strategy-ci is decided elsewhere and
# pulled from there:
#
# - The version -- wickra-strategy-ci's latest release, not the version on main:
#   between a bump merging and its tag being pushed, Cargo.toml is ahead
#   of anything a reader can install.
# - The indicator counts -- the core's, and the backtest registry's that the
#   registry products resolve through -- at the latest releases, set by the
#   org's one rule set, wickra-lib/.github's scripts/sync-counts.mjs, checked
#   out at a pinned commit (site_current.py moves the pin).
#
# A schedule is the only trigger that can work: the values change in the OTHER
# repositories, so no push here is the event that makes this page wrong.
#
# Same shape as webpage's sync-from-wickra.yml.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the released version and the indicator counts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the corrected values back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the released version from wickra-strategy-ci
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra-strategy-ci/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra-strategy-ci's latest release is ${version}"

      - name: Apply it
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(text: 'v)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" .vitepress/config.ts
          sed -i -E "s|<version>[0-9]+\.[0-9]+\.[0-9]+</version>|<version>${V}</version>|" index.md api/java.md
          sed -i -E "s|(org\.wickra:wickra-strategy-ci:)[0-9]+\.[0-9]+\.[0-9]+|\1${V}|" index.md api/java.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # One file, read-only, at the commit site_current.py pinned. It lands
      # beside the site and is excluded from git, so the commit below cannot
      # pick it up.
      - name: Check out the count rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wickra-lib/.github
          ref: d683af6320d14973d311968842600b332b7d3e79
          path: .wickra-org
          sparse-checkout: scripts/sync-counts.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set the indicator counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ".wickra-org/" >> .git/info/exclude
          node .wickra-org/scripts/sync-counts.mjs --repo wickra-strategy-ci-site

      - name: Commit if changed
        id: commitcheck
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "already at version ${V} with current counts; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: sync the released version to ${{ steps.version.outputs.version }} and the indicator counts"
          paths: .
