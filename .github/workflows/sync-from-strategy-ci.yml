name: Sync from wickra-strategy-ci

# The version this site shows is decided in wickra-lib/wickra-strategy-ci: the latest
# release, not the version on main -- between a bump merging and its tag being
# pushed, Cargo.toml is ahead of anything a reader can install. Pulling it on a
# schedule is the only trigger that can work: the value changes in the OTHER
# repository, so no push here is the event that makes this page wrong.
#
# Same shape as webpage's sync-from-wickra.yml.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the released version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the corrected values back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the released version from wickra-strategy-ci
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra-strategy-ci/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra-strategy-ci's latest release is ${version}"

      - name: Apply it
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(text: 'v)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" .vitepress/config.ts
          sed -i -E "s|<version>[0-9]+\.[0-9]+\.[0-9]+</version>|<version>${V}</version>|" index.md api/java.md
          sed -i -E "s|(org\.wickra:wickra-strategy-ci:)[0-9]+\.[0-9]+\.[0-9]+|\1${V}|" index.md api/java.md

      - name: Commit if changed
        id: commitcheck
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "already at version ${V}; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@782bf3d7a8edb80ada87dc7ba9067e2bf5752710 # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: sync the released version to ${{ steps.version.outputs.version }}"
          paths: .
